name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The production build refuses NEXT_PUBLIC_AUTH_MODE=dev, so CI builds in supabase mode with placeholders.
  NEXT_PUBLIC_AUTH_MODE: supabase
  NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key

jobs:
  verify:
    name: Lint, typecheck, unit tests, API drift, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: API type drift (generated types must match openapi/openapi.json)
        run: npm run api:check
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E against the real backend dev stack
    # REQUIRES CONFIGURATION: set the repository variable BACKEND_REPO (e.g. "your-org/enterprise-dms-backend")
    # and, if the backend repo is private, the secret BACKEND_REPO_TOKEN (read-only deploy token).
    # Optionally set BACKEND_REF. The job is skipped until BACKEND_REPO is configured.
    if: ${{ vars.BACKEND_REPO != '' }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Check out the backend
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BACKEND_REPO }}
          ref: ${{ vars.BACKEND_REF || 'main' }}
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
          path: backend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start the backend dev stack (embedded Postgres + API + worker, local auth, test scanner)
        working-directory: backend
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -e .
          nohup python scripts/dev_stack.py > ../dev_stack.log 2>&1 &
          for i in $(seq 1 90); do curl -fs http://localhost:8000/health/ready && break; sleep 2; done
          curl -fs http://localhost:8000/health/ready
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium chrome # chrome: real PDF viewer for pdf-preview.spec
      # The backend must allow framing from http://localhost:3100 (FRAME_ANCESTORS) for pdf-preview.spec.
      - name: Run Playwright (starts `next dev` on :3100 with a same-origin proxy to the backend)
        run: npm run e2e
        env:
          NEXT_PUBLIC_AUTH_MODE: dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            dev_stack.log
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: >
          docker build
          --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
          --build-arg NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
          --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=placeholder-publishable-key
          -t enterprise-dms-frontend:ci .
